<svg width="1200" height="470" viewBox="0 0 1200 470" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="470"><stop stop-color="#090B12"/><stop offset="1" stop-color="#0D1220"/></linearGradient>
  <linearGradient id="line" x1="250" y1="80" x2="940" y2="390"><stop stop-color="#22D3EE"/><stop offset=".48" stop-color="#8B5CF6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#8B5CF6" stop-opacity=".38"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  <style>
    .orbit { stroke-dasharray: 8 14; animation: dash 13s linear infinite; }
    .orbit2 { stroke-dasharray: 5 17; animation: dash2 17s linear infinite; }
    .node { animation: pulse 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
    .node2 { animation: pulse 4.8s ease-in-out infinite 1s; transform-box: fill-box; transform-origin:center; }
    @keyframes dash { to { stroke-dashoffset:-180; } }
    @keyframes dash2 { to { stroke-dashoffset:180; } }
    @keyframes pulse { 0%,100% { opacity:.78; transform:scale(.98); } 50% { opacity:1; transform:scale(1.035); } }
  </style>
</defs>
