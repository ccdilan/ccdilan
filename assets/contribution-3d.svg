    @keyframes f3{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes dash{to{stroke-dashoffset:-120}} @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
</defs>
